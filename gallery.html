<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="View food and dining moments at Royal Bites.">
    <title>Gallery | Royal Bites</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <div id="site-header"></div>
    <main>
        <section class="page-hero">
            <div class="container">
                <span class="eyebrow">A FEAST FOR THE EYES</span>
                <h1>Our <em>gallery</em></h1>
                <p>Take a glimpse at the dishes, details, and atmosphere that make us Royal Bites.</p>
            </div>
        </section>
        <section class="section-pad">
            <div class="container">
                <div class="gallery-grid">
                    <figure class="gallery-item gallery-tall">
                        <img src="https://images.unsplash.com/photo-1546549032-9571cd6b27df?auto=format&fit=crop&w=1000&q=85"
                            alt="Beautifully plated pasta">
                        <figcaption>Crafted with care</figcaption>
                    </figure>
                    <figure class="gallery-item">
                        <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=900&q=85"
                            alt="Freshly baked pizza">
                        <figcaption>Fresh from the oven</figcaption>
                    </figure>
                    <figure class="gallery-item">
                        <img src="https://images.unsplash.com/photo-1565557623262-b51c2513a641?auto=format&fit=crop&w=900&q=85"
                            alt="Indian curry with herbs">
                        <figcaption>Rich in flavour</figcaption>
                    </figure>
                    <figure class="gallery-item">
                        <img src="https://images.unsplash.com/photo-1551024506-0bcf6a8a8e2e?auto=format&fit=crop&w=900&q=85"
                            alt="Sweet dessert selection"
                            onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1551024506-0bcf6a8a8e2e?auto=format&fit=crop&w=900&q=85'">
                        <figcaption>A sweet finish</figcaption>
                    </figure>
                    <figure class="gallery-item">
                        <img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=900&q=85"
                            alt="Restaurant interior with warm lighting">
                        <figcaption>Set the scene</figcaption>
                    </figure>
                    <figure class="gallery-item gallery-wide">
                        <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=85"
                            alt="Warm restaurant dining space">
                        <figcaption>Gather around the table</figcaption>
                    </figure>
                </div>
                <div class="text-center mt-5">
                    <p class="muted-copy">Images are loaded from Unsplash and require an internet connection.</p>
                    <a class="btn btn-dark-burgundy" href="contact.html#booking">Join us for a meal <span>↗</span></a>
                </div>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
