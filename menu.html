<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Explore the Royal Bites food and drink menu.">
    <title>Menu | Royal Bites</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <div id="site-header"></div>
    <main>
        <section class="page-hero">
            <div class="container">
                <span class="eyebrow">FRESH FROM OUR KITCHEN</span>
                <h1>Our <em>menu</em></h1>
                <p>Comforting classics and flavour-packed favourites, made to be shared.</p>
            </div>
        </section>
        <section class="section-pad">
            <div class="container">
                <div class="menu-toolbar">
                    <div>
                        <span class="eyebrow eyebrow-dark">FIND YOUR FAVOURITE</span>
                        <h2 class="section-title">Made to <em>savour</em></h2>
                    </div>
                    <div class="filter-group" id="menu-filters" role="group" aria-label="Filter menu by category">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="starters">Starters</button>
                        <button class="filter-btn" data-filter="mains">Mains</button>
                        <button class="filter-btn" data-filter="pizza">Pizza</button>
                        <button class="filter-btn" data-filter="desserts">Desserts</button>
                        <button class="filter-btn" data-filter="drinks">Drinks</button>
                    </div>
                </div>
                <div class("row g-4" id("menu-grid" aria-live("polite")).></div>
                <div class("menu-note mt-5"><strong>Have a dietary question?</strong> Please let our team know before
                    ordering. Menu items and prices shown here are sample content and can be edited in
                    <code>js/script.js</code>.</div>
            </div>
        </section>
    </main>
    <div id("site-footer"></div>
    <script src("https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src("js/script.js"></script>
</body>

</html>
